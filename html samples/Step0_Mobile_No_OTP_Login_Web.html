<!DOCTYPE html>

<html class="light" lang="en"><head>

                        "on-primary-fixed": "#002019",
                        "surface-variant": "#dee4e0",
                        "tertiary-fixed-dim": "#ffb77b",
                        "tertiary": "#87521e",
                        "primary": "#006b58",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#89f6d8",

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #737875; /* Neutral Base */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-[#737875]/10 dark:bg-slate-900/50 backdrop-blur-md font-['Inter'] tracking-tight leading-relaxed docked full-width top-0 sticky no-border shadow-none bg-surface-tonal flat no-shadows z-50">
<div class="flex justify-between items-center w-full px-8 py-4 max-w-screen-2xl mx-auto">
<div class="text-xl font-bold tracking-tighter text-[#089278] dark:text-[#6bd9bc] uppercase">
                Sikkim Higher Education
            </div>
<nav class="hidden md:flex gap-8 items-center">
<a class="text-[#587f73] dark:text-slate-400 hover:text-[#089278] transition-colors hover:bg-[#089278]/5 transition-all duration-300 rounded-md px-3 py-2 scale-95 duration-200 ease-in-out" href="#">Admissions</a>
<a class="text-[#587f73] dark:text-slate-400 hover:text-[#089278] transition-colors hover:bg-[#089278]/5 transition-all duration-300 rounded-md px-3 py-2 scale-95 duration-200 ease-in-out" href="#">Scholarships</a>
<a class="text-[#587f73] dark:text-slate-400 hover:text-[#089278] transition-colors hover:bg-[#089278]/5 transition-all duration-300 rounded-md px-3 py-2 scale-95 duration-200 ease-in-out" href="#">Institutions</a>
<a class="text-[#587f73] dark:text-slate-400 hover:text-[#089278] transition-colors hover:bg-[#089278]/5 transition-all duration-300 rounded-md px-3 py-2 scale-95 duration-200 ease-in-out" href="#">Support</a>
</nav>
<div class="flex items-center gap-4 hidden">
<button class="text-[#089278] dark:text-[#6bd9bc] hover:bg-[#089278]/5 transition-all duration-300 p-2 rounded-full scale-95 duration-200 ease-in-out flex items-center justify-center">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="text-[#089278] dark:text-[#6bd9bc] hover:bg-[#089278]/5 transition-all duration-300 p-2 rounded-full scale-95 duration-200 ease-in-out flex items-center justify-center">
<span class="material-symbols-outlined">help</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-6 sm:p-12">
<!-- Centered Verification Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl p-8 sm:p-10 relative overflow-hidden shadow-[0_32px_64px_rgba(0,0,0,0.04)]" style="box-shadow: 0 32px 64px rgba(0,0,0,0.04);">
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-secondary"></div>
<!-- Header Section -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container mb-4">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-headline text-2xl font-bold text-on-surface tracking-tight mb-2">Verification</h1>
<p class="font-body text-on-surface-variant text-sm leading-relaxed">
                    Resume Application or Track Status
                </p>
</div>
<!-- Form Flow -->
<form class="space-y-6">
<!-- Step 1: Mobile Number -->
<div class="space-y-2">
<label class="block font-label text-sm font-medium text-on-surface-variant" for="mobile-number">Mobile Number</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-on-surface-variant font-body">+91</span>
<input class="w-full pl-12 pr-4 py-3 rounded-lg bg-surface-container-low border border-outline-variant/30 focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-bright transition-colors font-body text-on-surface outline-none placeholder:text-on-surface-variant/50" id="mobile-number" maxlength="10" name="mobile-number" pattern="[0-9]{10}" placeholder="Enter 10-digit number" type="tel" value="9876543210"/>
</div>
</div>
<!-- OTP Status / Feedback -->
<div class="flex items-center gap-2 p-3 rounded-lg bg-tertiary-container/20 border border-tertiary-container/30">
<span class="material-symbols-outlined text-tertiary text-sm">mark_email_read</span>
<p class="font-label text-xs text-on-surface-variant">OTP sent successfully to +91 9876543210</p>
</div>
<!-- Step 2: OTP Entry -->
<div class="space-y-3">
<div class="flex justify-between items-center">
<label class="block font-label text-sm font-medium text-on-surface-variant">Enter 6-digit OTP</label>
<span class="font-label text-xs font-semibold text-primary">01:45</span>
</div>
<div class="flex gap-2 justify-between">
<!-- OTP Boxes (Simulated input array) -->
<input class="w-12 h-14 text-center text-xl font-bold rounded-lg bg-surface-container border border-outline-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright outline-none transition-all text-on-surface" maxlength="1" type="text" value="4"/>
<input class="w-12 h-14 text-center text-xl font-bold rounded-lg bg-surface-container border border-outline-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright outline-none transition-all text-on-surface" maxlength="1" type="text" value="8"/>
<input class="w-12 h-14 text-center text-xl font-bold rounded-lg bg-surface-container border border-outline-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright outline-none transition-all text-on-surface" maxlength="1" type="text" value=""/>
<input class="w-12 h-14 text-center text-xl font-bold rounded-lg bg-surface-container border border-outline-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright outline-none transition-all text-on-surface" maxlength="1" type="text" value=""/>
<input class="w-12 h-14 text-center text-xl font-bold rounded-lg bg-surface-container border border-outline-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright outline-none transition-all text-on-surface" maxlength="1" type="text" value=""/>
<input class="w-12 h-14 text-center text-xl font-bold rounded-lg bg-surface-container border border-outline-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright outline-none transition-all text-on-surface" maxlength="1" type="text" value=""/>
</div>
</div>
<!-- Actions -->
<div class="pt-4 space-y-4">
<button class="w-full py-3.5 px-4 rounded-lg bg-primary text-on-primary font-headline font-semibold text-sm hover:bg-primary/90 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface flex justify-center items-center gap-2" type="button">
                        Verify &amp; Proceed
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<div class="text-center">
<button class="font-label text-sm font-medium text-secondary hover:text-primary transition-colors focus:outline-none underline decoration-transparent hover:decoration-primary underline-offset-4" type="button">
                            Resend OTP
                        </button>
</div>
</div>
</form>
</div>
</main>
</body></html>
